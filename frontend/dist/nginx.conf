server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API — single upstream (adjust hostname for your environment)
    location /api/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Django admin — same internal upstream
    location /django-admin/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static — same upstream
    location /static/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Django media — same upstream
    location /media/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
