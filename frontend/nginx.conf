server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

   location /api/ {
    proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host api.sokomkononi.co.tz;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 20M;
    proxy_redirect off;
}

    location /django-admin/ {
        proxy_pass https://api.sokomkononi.co.tz/admin/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sokomkononi.co.tz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass https://api.sokomkononi.co.tz/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sokomkononi.co.tz;
    }

    location /media/ {
        proxy_pass https://api.sokomkononi.co.tz/media/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sokomkononi.co.tz;
    }
}
