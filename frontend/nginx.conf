server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ GZIP: Inapunguza ukubwa wa HTML, CSS, JS kwa hadi 70%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    # ✅ CACHING: Files za Vite zina hash kwenye majina (mfano: index-Dql5uV1R.js)
    # Tunaweka cache ya mwaka mzima (1 year) kwa sababu hash inabadilika kila build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ✅ CACHING: Picha na Fonts
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ✅ LCP OPTIMIZATION: Logo (inayotumika kwenye navbar/hero)
    # Inacachekiwa kwa muda mrefu kwa sababu haibadiliki mara kwa mara
    location = /logo.webp {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location = /favicon.webp {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ✅ REACT ROUTER: Kurasa zote zielekee kwenye index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # ✅ Hii inahakikisha index.html haicacheki kwa muda mrefu
        # ili mtumiaji apate version mpya mara tu unapofanya deployment
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ✅ SECURITY HEADERS (Inaongeza alama za Best Practices & Inaruhusu Turnstile)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ✅ COOP: Muhimu kwa Google Auth & Payment Gateways
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    
    # ✅ CSP ILIYOREKEBISHWA: Imeongeza challenges.cloudflare.com kwenye frame-src, connect-src, na script-src
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com;" always;
}