server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ✅ GZIP: Inapunguza ukubwa wa HTML, CSS, JS kwa hadi 70%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    # ✅ CACHING: Files za Vite zina hash kwenye majina (mfano: index-Dql5uV1R.js)
    # Kwa hiyo tunaweza kuziwekea cache ya mwaka mzima (1 year)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ✅ CACHING: Picha na Fonts
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ✅ API PROXY: Kama unahitaji, lakini kwa kuwa API iko kwenye subdomain (api.sokomkononi.co.tz), 
    # hii inaweza kuwa haihitajiki. Ila kama una proxy, iwe hivi:
    # location /api/ {
    #     proxy_pass https://api.sokomkononi.co.tz/api/;
    #     proxy_set_header Host $host;
    # }

    # ✅ REACT ROUTER: Kurasa zote zielekee kwenye index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # ✅ Hii inahakikisha index.html haicacheki kwa muda mrefu
        # ili mtumiaji apate version mpya mara tu unapofanya deployment
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ✅ Security Headers (Inaongeza alama za Best Practices)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:;" always;
}