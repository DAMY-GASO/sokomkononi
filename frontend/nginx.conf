server {
    error_log /var/log/nginx/error.log warn;
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS in front of us
    real_ip_header CF-Connecting-IP;

    # Docker's internal DNS resolver — do NOT cache forever
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 20M;
    client_body_buffer_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Hashed Vite assets: cache forever ----
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Public static files ----
    location ~* \.(svg|webp|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- API ----
    location /api/ {
        # Variable forces request-time DNS resolution, so nginx starts
        # even when the backend hostname isn't up yet.
        set $backend_api "sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass http://$backend_api/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Django admin ----
    location /django-admin/ {
        set $backend_admin "sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass http://$backend_admin/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /django-admin;
        proxy_redirect ~^/admin/(.*)$ /django-admin/$1;
    }

    # ---- Django static ----
    location /static/ {
        set $backend_static "sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass http://$backend_static/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /static;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Django media ----
    location /media/ {
        set $backend_media "sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass http://$backend_media/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /media;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- SPA fallback (must be LAST) ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
