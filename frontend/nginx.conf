server {
    error_log /var/log/nginx/error.log warn;
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- DNS resolver kwa Docker Swarm ----
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- Compression ----
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # ---- Uploads ----
    client_max_body_size 20M;
    client_body_buffer_size 1m;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Hashed Vite assets ----
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- API (dynamic DNS resolution) ----
    location /api/ {
        set $backend "http://sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_request_buffering off;
        proxy_pass $backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Django admin ----
    location /django-admin/ {
        set $backend "http://sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass $backend/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /django-admin;
        proxy_redirect ~^/admin/(.*)$ /django-admin/$1;
    }

    # ---- Django static ----
    location /static/ {
        set $backend "http://sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass $backend/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /static;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Django media ----
    location /media/ {
        set $backend "http://sokomkononi-sokomkononi-server-rcnbg2:8000";
        proxy_pass $backend/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /media;
        expires 7d;
        add_header Cache-Control "public";
    }
}
