server {
    # Print warnings and errors only — suppress [notice] startup chatter.
    error_log /var/log/nginx/error.log warn;
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # ---- Uploads ----
    client_max_body_size 20M;
    client_body_buffer_size 1m;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Hashed Vite assets: cache for a year ----
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- API ----
    location /api/ {
        proxy_request_buffering off;
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---- Django admin, mounted under /django-admin/ ----
    #
    # Django must be started with FORCE_SCRIPT_NAME="/django-admin"
    # (or the equivalent settings) so it generates URLs prefixed
    # with /django-admin. The X-Forwarded-Prefix header tells Django
    # the public mount point.
    location /django-admin/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /django-admin;
        proxy_redirect ~^/admin/(.*)$ /django-admin/$1;
    }

    # ---- Django static ----
    location /static/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /static;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- Django media ----
    location /media/ {
        proxy_pass http://sokomkononi-sokomkononi-server-rcnbg2:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /media;
        expires 7d;
        add_header Cache-Control "public";
    }
}
