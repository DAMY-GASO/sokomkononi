server {
    error_log /var/log/nginx/error.log warn;
    listen 3001;
    listen [::]:3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- DNS resolver kwa Docker Swarm ----
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # HAKUNA proxy_pass kwa /api/ — browser inatuma moja kwa moja
    # kwa https://api.sokomkononi.co.tz/api
    #
    # Hii inaepusha:
    #   - DisallowedHost (Host header isiyo sahihi)
    #   - SECURE_SSL_REDIRECT redirects
    #   - CSRF issues
    #   - 401 Unauthorized
    # ============================================================
}
