server {
    error_log /var/log/nginx/error.log warn;
    listen 3001;
    listen [::]:3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- DNS resolver kwa Docker Swarm ----
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API ----
   location /api/ {
    set $backend "http://sokomkononi-sokomkononi-server-rcnbg2:8000";
    proxy_request_buffering off;
    proxy_pass $backend/api/;
    proxy_http_version 1.1;
    
    # Badilisha hizi:
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Kuwa:
    proxy_set_header Host api.sokomkononi.co.tz;
    proxy_set_header X-Forwarded-Host api.sokomkononi.co.tz;
    proxy_set_header X-Forwarded-Proto https;
    
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /api;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
}
